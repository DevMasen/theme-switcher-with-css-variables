<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Switcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="theme-switcher" role="radiogroup" aria-label="Choose a theme">
    <input type="radio" id="theme-light" name="theme" value="light" checked>
    <label for="theme-light" class="theme-option">Light</label>

    <input type="radio" id="theme-dark" name="theme" value="dark">
    <label for="theme-dark" class="theme-option">Dark</label>

    <input type="radio" id="theme-rose" name="theme" value="rose">
    <label for="theme-rose" class="theme-option">Rose</label>
  </div>

  <main>
    <div class="card">
      <h1 class="card-title">Theme Preview</h1>
      <p class="card-body">This card changes appearance by swapping CSS design tokens. No JavaScript is used.</p>
      <button class="card-button">Select Theme</button>
    </div>
  </main>

</body>
</html>
